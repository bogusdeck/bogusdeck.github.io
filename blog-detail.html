<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <!-- Use the existing icon instead of getting 404 for favicon.ico -->
    <link rel="icon" type="image/png" href="assets/index/images/pixelboyhead.png">
    <meta name="description" content="Blog post details.">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/global.css">
    
    <!-- Include components so we can use them! -->
    <script src="components/navbar-menu.js"></script>

    <style>
        body {
            background-color: black;
            background-repeat: repeat;
            background-position: top center;
            background-attachment: scroll;
            background-size: 30% auto;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .blog-content img {
            max-width: 100%;
            height: auto;
            border: 2px solid white;
            margin: 15px 0;
        }
        
        .blog-content a {
            color: #3b82f6;
            text-decoration: underline;
        }

        .blog-content pre {
            background: #1f2937;
            padding: 15px;
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid #374151;
            font-family: 'Proggy', monospace;
            font-size: 16px;
        }

        .blog-content code {
            font-family: 'Proggy', monospace;
            background: #374151;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 14px;
        }

        .blog-content p, .blog-content li, .blog-content a {
            font-family: 'Rainy', monospace;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .blog-content ul {
            list-style-type: disc;
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .blog-content ol {
            list-style-type: decimal;
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .blog-content blockquote {
            border-left: 4px solid #ffcc00;
            padding-left: 15px;
            margin-left: 0;
            margin-bottom: 15px;
            color: #9ca3af;
        }

        .blog-content h1, .blog-content h2, .blog-content h3 {
            font-family: 'Joystick', monospace;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.4;
            color: #ffcc00;
        }
    </style>
</head>

<body>
    <!-- Using our new navbar component -->
    <navbar-menu></navbar-menu>

    <main class="py-6 mt-14 w-full px-4 sm:px-16 space-y-8 flex-grow flex justify-center">
        <div class="boxxy w-full max-w-4xl p-6 md:p-10" id="blog-detail-container">
            <div class="text-center">
                <p class="headingfont text-gray-400">Loading post...</p>
            </div>
        </div>
    </main>

    <footer class="flex flex-col md:flex-row items-center justify-center bg-gray-950 bg-opacity-50 py-6 w-full mt-10 gap-2 z-50">
        <p class="text-white max-[320px]:text-[8px] text-[10px] lg:text-[16px]">Copyright © 2024 --</p>
        <a href="mailto:tanishvashisth@gmail.com"
            class="text-white max-[320px]:text-[8px] text-[10px] lg:text-[16px] underline">tanishvashisth@gmail.com</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const container = document.getElementById('blog-detail-container');

            if (!postId) {
                container.innerHTML = '<div class="text-center"><h2 class="title text-red-500">Error</h2><p class="headingfont mt-4">No article ID provided.</p><a href="blog.html" class="mt-6 inline-block bg-gray-700 px-4 py-2 text-white hover:bg-gray-600">Back to Blog</a></div>';
                return;
            }

            fetch(`https://dev.to/api/articles/${postId}`)
                .then(response => {
                    if (!response.ok) throw new Error('Article not found');
                    return response.json();
                })
                .then(post => {
                    // Update document title
                    document.title = post.title;
                    
                    const tagsArray = post.tags || [];
                    const tags = tagsArray.map(tag => `<span class="bg-blue-900 text-white text-[10px] px-2 py-1 mr-2 mb-2 border border-blue-500">#${tag}</span>`).join('');
                    const coverImage = post.cover_image ? `<img src="${post.cover_image}" alt="Cover Image" class="w-full h-auto mb-6 border-4 border-white">` : '';

                    container.innerHTML = `
                        <div class="mb-4">
                            <a href="blog.html" class="text-gray-400 hover:text-white headingfont text-sm">< Back to Posts</a>
                        </div>
                        ${coverImage}
                        <h1 class="text-2xl md:text-3xl font-bold title mb-4 text-white" style="line-height: 1.4;">${post.title}</h1>
                        <div class="flex items-center mb-6">
                            <img src="${post.user.profile_image}" alt="${post.user.name}" class="w-10 h-10 rounded-full mr-3 border-2 border-white">
                            <div>
                                <p class="headingfont text-sm text-gray-200">${post.user.name}</p>
                                <p class="headingfont text-xs text-gray-400">${new Date(post.published_at).toDateString()}</p>
                            </div>
                        </div>
                        <div class="mb-8 flex flex-wrap">
                            ${tags}
                        </div>
                        <div class="blog-content text-gray-200 bg-black bg-opacity-50 p-4 md:p-8 border border-gray-800">
                            ${post.body_html}
                        </div>
                        <div class="mt-8 pt-6 border-t border-gray-800 text-center flex justify-center">
                            <a href="${post.url}" target="_blank" rel="noopener noreferrer" class="boxxy bg-[#5f5fec] hover:bg-blue-600 px-6 py-3 text-white headingfont inline-flex items-center justify-center gap-4">
                                <img src="assets/images/logo/dev_logo.png" alt="Dev.to" class="img w-10 h-auto border-2 border-white">
                                <span>View on Dev.to</span>
                            </a>
                        </div>
                    `;
                })
                .catch(error => {
                    console.error('Error fetching blog post:', error);
                    container.innerHTML = '<div class="text-center"><h2 class="title text-red-500">Error</h2><p class="headingfont mt-4">Could not load the article. It may have been deleted or the API is down.</p><a href="blog.html" class="mt-6 inline-block bg-gray-700 px-4 py-2 text-white hover:bg-gray-600">Back to Blog</a></div>';
                });
        });
    </script>
</body>
</html>
